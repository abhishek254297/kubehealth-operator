# This rule is not used by the project kubehealth-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.abhishek.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubehealth-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubehealth-editor-role
rules:
- apiGroups:
  - apps.abhishek.dev
  resources:
  - kubehealths
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.abhishek.dev
  resources:
  - kubehealths/status
  verbs:
  - get
