---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.abhishek.dev
  resources:
  - kubehealths
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.abhishek.dev
  resources:
  - kubehealths/finalizers
  verbs:
  - update
- apiGroups:
  - apps.abhishek.dev
  resources:
  - kubehealths/status
  verbs:
  - get
  - patch
  - update
